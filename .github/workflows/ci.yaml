# CI for Product Catalog Service

name: product-catalog-ci

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src/product-catalog/go.sum

      - name: Download dependencies
        working-directory: src/product-catalog
        run: go mod download

      - name: Build
        working-directory: src/product-catalog
        run: go build -o product-catalog-service main.go

      - name: Unit tests
        working-directory: src/product-catalog
        run: go test ./...


  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src/product-catalog/go.sum

      - name: Run golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: src/product-catalog


  docker:
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}
            ${{ secrets.DOCKER_USERNAME }}/product-catalog:latest


  updatek8s:
    runs-on: ubuntu-latest

    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in Kubernetes manifest
        run: |
          sed -i \
          "s|image: .*product-catalog.*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}|" \
          kubernetes/productcatalog/deploy.yaml

      - name: Commit and push changes
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

          git add kubernetes/productcatalog/deploy.yaml

          git diff --cached --quiet || \
          git commit -m "[CI]: Update product catalog image tag to ${{ github.run_id }}"

          git push origin main
        
        
          


        